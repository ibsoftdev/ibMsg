spring:
  application:
    name: ibMsg
  config:
    import: optional:classpath:ibMsgEnv.properties
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: false
  threads:
    virtual:
      enabled: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8082
  servlet:
    context-path: /

logging:
  config: classpath:log4j.xml

# Pool JDBC (Tomcat embebido). Misma sección; sin JNDI.
datasource:
  jndi:
    driver-class-name: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@172.17.0.1:32118:XE
    # url: jdbc:oracle:thin:@192.168.229.137:1521:SEGU
    username: extranet
    password: extranet
    max-active: 20
    max-idle: 10
    min-idle: 5
    initial-size: 5
    test-on-borrow: true
    validation-query: SELECT 1 FROM DUAL
    max-wait: 10000
    connection-timeout: 30000
    socket-timeout: 30000
    login-timeout: 30
